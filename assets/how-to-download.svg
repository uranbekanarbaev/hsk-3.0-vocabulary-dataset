<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440"><rect width="1200" height="440" rx="18" fill="#f1f3e9"/><g font-family="Arial,sans-serif" fill="#173f36"><text x="35" y="44" font-size="22" font-weight="700">Your download, in three simple steps</text><text x="35" y="71" font-size="13" fill="#5d7267">Illustration of the download flow · GitHub's layout can vary by screen size</text><g transform="translate(35,100)"><rect width="355" height="290" rx="12" fill="white"/><circle cx="30" cy="33" r="17" fill="#173f36"/><text x="25" y="39" fill="white" font-size="17">1</text><text x="59" y="40" font-size="19" font-weight="700">Choose a file</text><text x="23" y="89" font-size="15">In the README, click the file link:</text><rect x="23" y="115" width="305" height="50" rx="8" fill="#1c624d"/><text x="48" y="147" fill="white" font-size="17">Download PDF / CSV / ZIP ↓</text><text x="23" y="205" font-size="15">Many links download immediately.</text><text x="23" y="234" font-size="15">No account needed.</text></g><g transform="translate(423,100)"><rect width="355" height="290" rx="12" fill="white"/><circle cx="30" cy="33" r="17" fill="#173f36"/><text x="25" y="39" fill="white" font-size="17">2</text><text x="59" y="40" font-size="19" font-weight="700">If a preview opens</text><text x="23" y="89" font-size="15">On a GitHub file page, look for:</text><rect x="23" y="115" width="305" height="50" rx="8" fill="#eef1ec" stroke="#bacbbf"/><text x="47" y="147" font-size="18">↓  Download raw file</text><text x="23" y="205" font-size="15">In a browser PDF viewer, use its</text><text x="23" y="234" font-size="15">download arrow or Save action.</text></g><g transform="translate(811,100)"><rect width="355" height="290" rx="12" fill="white"/><circle cx="30" cy="33" r="17" fill="#173f36"/><text x="25" y="39" fill="white" font-size="17">3</text><text x="59" y="40" font-size="19" font-weight="700">Open and study</text><rect x="23" y="108" width="305" height="68" rx="8" fill="#e8eedb"/><text x="40" y="136" font-size="16">PDF → open or print</text><text x="40" y="161" font-size="16">ZIP → extract, then open the folder</text><text x="23" y="214" font-size="15">On a phone: Save to Files,</text><text x="23" y="239" font-size="15">then unzip in your Files app.</text></g></g></svg>